[package]
name = "warden-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Policy engine for shell commands and file writes: allow or deny with a reason, and log every answer"
license = "Apache-2.0"
repository = "https://github.com/bolexs/warden"
readme = "README.md"
keywords = ["policy", "shell", "guard", "agent", "hook"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "warden"
path = "src/lib.rs"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"

[profile.release]
strip = true
lto = true
codegen-units = 1
